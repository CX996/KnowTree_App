<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../apps/web/assets/styles/pet.css">
</head>
<body data-pet-mode="ambient">
  <input id="focusInput" aria-label="test input">
  <div data-pet-mount></div>
  <pre id="browserResult">PENDING</pre>
  <script>
    localStorage.clear();
    sessionStorage.clear();
    localStorage.setItem('knowtree.pet.collapsed.v1', '1');
    let pendingInbox = false;
    window.KT = {
      inbox: function () {
        return {
          pending: pendingInbox ? [{ id: 'pending-1' }] : [],
          dups: []
        };
      }
    };
  </script>
  <script type="module">
    const failures = [];
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const check = (condition, message) => {
      if (!condition) failures.push(message);
    };
    const emit = (name, detail) => {
      document.dispatchEvent(new CustomEvent(name, { detail: detail || {} }));
    };
    const mount = () => document.querySelector('[data-pet-mount]');
    const bubble = () => document.querySelector('.pet-bubble');

    try {
      await import('../../../apps/web/assets/pet.js?browser-contract=1');
      await wait(80);
      window.pendingInbox = true;
      pendingInbox = true;
      localStorage.setItem('knowtree.pet.hintShown.v1', String(Date.now() - 60_000));
      emit('knowtree:data-ready');
      await wait(40);

      check(mount().dataset.state === 'carry', 'pending inbox must show carry');
      check(document.querySelectorAll('.pet-bubble').length === 1, 'only one bubble may exist');
      check(bubble().hidden === false, 'pending inbox bubble must be visible');
      check(mount().hidden === false, 'legacy collapse preference must not hide the pet');
      check(document.querySelector('.pet-collapse') === null, 'collapse control must be absent');

      const petButton = document.querySelector('.pet-hit');
      const initialLeft = mount().style.left;
      const initialTop = mount().style.top;
      petButton.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, pointerId: 1, pointerType: 'touch', isPrimary: true,
        button: 0, clientX: 100, clientY: 100,
      }));
      document.dispatchEvent(new PointerEvent('pointermove', {
        bubbles: true, pointerId: 1, pointerType: 'touch', isPrimary: true,
        button: 0, clientX: 150, clientY: 140,
      }));
      document.dispatchEvent(new PointerEvent('pointerup', {
        bubbles: true, pointerId: 1, pointerType: 'touch', isPrimary: true,
        button: 0, clientX: 150, clientY: 140,
      }));
      await wait(20);
      check(mount().style.left !== initialLeft || mount().style.top !== initialTop,
        'dragging must move the pet');
      check(
        JSON.parse(localStorage.getItem('knowtree.pet.position.v1') || 'null') !== null,
        'dragging must persist pet position',
      );

      emit('knowtree:pet-size', { size: 'large' });
      await wait(40);
      check(mount().dataset.size === 'large', 'size event must apply large companion');
      const largeRect = mount().getBoundingClientRect();
      check(
        largeRect.right <= window.innerWidth - 6,
        'large companion must stay inside width: right=' + largeRect.right +
          ', width=' + largeRect.width + ', viewport=' + window.innerWidth +
          ', styleLeft=' + mount().style.left,
      );
      check(
        largeRect.bottom <= window.innerHeight - 6,
        'large companion must stay inside height: bottom=' + largeRect.bottom +
          ', height=' + largeRect.height + ', viewport=' + window.innerHeight +
          ', styleTop=' + mount().style.top,
      );

      petButton.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, pointerId: 2, pointerType: 'touch', isPrimary: true,
        button: 0, clientX: 160, clientY: 180,
      }));
      document.dispatchEvent(new PointerEvent('pointermove', {
        bubbles: true, pointerId: 2, pointerType: 'touch', isPrimary: true,
        button: 0, clientX: 220, clientY: 220,
      }));
      document.dispatchEvent(new PointerEvent('pointercancel', {
        bubbles: true, pointerId: 2, pointerType: 'touch', isPrimary: true,
        button: 0, clientX: 220, clientY: 220,
      }));
      await wait(20);
      check(mount().hidden === false, 'pointercancel must keep the companion visible');
      check(!mount().classList.contains('is-dragging'), 'pointercancel must end dragging');

      emit('knowtree:pet-reset');
      await wait(20);
      check(!mount().style.left && !mount().style.top, 'reset must return to CSS default position');
      check(localStorage.getItem('knowtree.pet.position.v1') === null, 'reset must clear saved position');

      document.querySelector('.pet-frame').dispatchEvent(new Event('error'));
      await wait(20);
      check(mount().dataset.asset === 'placeholder', 'asset failure must show placeholder state');
      check(mount().hidden === false, 'asset failure must keep companion mount visible');

      petButton.click();
      await wait(20);
      const menu = document.querySelector('.pet-menu');
      const menuLinks = Array.from(menu.querySelectorAll('a')).filter((link) => !link.hidden);
      check(menu.hidden === false, 'pet click must open quick menu');
      check(mount().hidden === false, 'pet tap must keep the companion visible');
      check(menuLinks.length === 3, 'pending inbox menu must expose three actions');
      check(menuLinks[0].getAttribute('href') === 'capture.html', 'capture action');
      check(menuLinks[1].getAttribute('href') === 'inbox.html', 'inbox action');
      check(menuLinks[2].getAttribute('href') === 'review.html', 'review action');
      check(document.activeElement === menuLinks[0], 'menu must focus first action');
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await wait(20);
      check(menu.hidden === true, 'Escape must close quick menu');
      check(document.activeElement === petButton, 'Escape must restore pet focus');

      emit('knowtree:input-focus');
      await wait(20);
      check(mount().dataset.state === 'listen', 'input focus must switch to listen');
      check(bubble().hidden === true, 'input focus must hide bubble');

      localStorage.setItem('knowtree.pet.hintShown.v1', String(Date.now() - 60_000));
      emit('knowtree:input-blur');
      await wait(20);
      emit('knowtree:data-ready');
      await wait(20);
      document.querySelector('.pet-bubble__close').click();
      await wait(20);
      check(bubble().hidden === true, 'close must hide bubble');
      check(
        JSON.parse(sessionStorage.getItem('knowtree.pet.hintDismissed.v1') || '[]').includes('inbox'),
        'dismissal must be remembered for the session',
      );
      emit('knowtree:data-ready');
      await wait(20);
      check(bubble().hidden === true, 'dismissed hint must not reappear');

      document.querySelectorAll('[data-pet-mount]').forEach((node) => node.remove());
      await import('../../../apps/web/assets/pet.js?browser-contract=2');
      await wait(30);
      check(mount().hidden === false, 'pet must remain visible after reload');

      localStorage.setItem('knowtree.pet.motion.v1', '1');
      document.querySelectorAll('[data-pet-mount]').forEach((node) => node.remove());
      await import('../../../apps/web/assets/pet.js?browser-contract=3');
      await wait(30);
      check(mount().dataset.motion === 'reduce', 'reduced motion preference must render static state');
    } catch (error) {
      failures.push(error && error.stack ? error.stack : String(error));
    }

    const result = failures.length ? 'FAIL\n' + failures.join('\n') : 'PASS';
    document.getElementById('browserResult').textContent = result;
    document.body.dataset.testResult = failures.length ? 'fail' : 'pass';
  </script>
</body>
</html>
