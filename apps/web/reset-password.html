<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110E" />
  <title>设置新密码 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/pages.css" />
</head>
<body>
  <main class="page page--auth auth-layout">
    <section class="auth-story">
      <a class="auth-brand" href="login.html" aria-label="返回登录">
        <span class="auth-brand__mark" aria-hidden="true"></span>
        <span>知树 KnowTree</span>
      </a>
      <div class="auth-kicker">安全重置</div>
      <h1 id="authTitle">给知树一把<br />新的钥匙。</h1>
      <p>设置新密码后，旧密码会立即失效。</p>
    </section>

    <section class="auth-panel" aria-labelledby="authTitle">
      <form id="resetForm" class="auth-card" novalidate hidden>
        <label class="auth-label" for="pwd">新密码</label>
        <input class="auth-input" id="pwd" type="password" minlength="8" placeholder="至少 8 位，包含字母和数字" autocomplete="new-password" required />

        <label class="auth-label mt16" for="pwdConfirm">确认新密码</label>
        <input class="auth-input" id="pwdConfirm" type="password" minlength="8" placeholder="再输入一次新密码" autocomplete="new-password" required />

        <p class="auth-hint t3 s12 mt12">密码至少 8 位，并同时包含字母和数字。</p>
        <button class="btn btn-primary btn-block mt16" id="savePassword" type="submit">保存新密码</button>
      </form>
      <div class="auth-status t3 s12 mt16" id="msg" aria-live="polite"></div>
      <div class="auth-links mt16"><a href="login.html">返回登录</a></div>
    </section>
  </main>

  <script src="assets/api.js"></script>
  <script type="module">
    import { parseAuthCallback, updatePassword, validateNewPassword } from './assets/auth-client.js';

    const form = document.getElementById('resetForm');
    const button = document.getElementById('savePassword');
    const message = (text) => { document.getElementById('msg').textContent = text || ''; };
    const callback = parseAuthCallback(location.hash);
    let config = null;

    KT.loadPublicConfig().then((value) => {
      config = value;
    }, (error) => {
      message('服务暂时不可用：' + error.message);
    });

    if (callback.errorDescription) {
      message('重置链接已失效：' + callback.errorDescription);
    } else if (!callback.accessToken) {
      message('重置链接无效或已过期，请重新申请。');
    } else {
      form.hidden = false;
      message('请输入新密码');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('pwd').value;
      const confirmPassword = document.getElementById('pwdConfirm').value;
      const strength = validateNewPassword(password);
      if (!strength.ok) {
        message(strength.message);
        document.getElementById('pwd').focus();
        return;
      }
      if (password !== confirmPassword) {
        message('两次输入的密码不一致');
        document.getElementById('pwdConfirm').focus();
        return;
      }
      if (!config || !callback.accessToken) {
        message('重置链接尚未就绪，请刷新页面重试');
        return;
      }

      button.disabled = true;
      message('正在保存…');
      try {
        await updatePassword(config, callback.accessToken, password);
        KT.setToken(callback.accessToken, callback.refreshToken);
        history.replaceState(null, '', location.pathname);
        message('密码已更新，正在进入知树…');
        setTimeout(() => location.replace('index.html'), 700);
      } catch (error) {
        button.disabled = false;
        message('保存失败：' + error.message);
      }
    });
  </script>
</body>
</html>
