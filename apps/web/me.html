<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>我的 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body data-tab="me">
  <main class="page page--tab">
    <div class="topbar">
      <div class="grow"><h1 class="h-big">我的</h1></div>
    </div>

    <div class="stats mt16" id="stats"></div>

    <div class="rows mt20">
      <button class="row" id="export">
        <span data-ic="download"></span><span class="grow">数据导出</span>
        <span class="val">JSON</span><span data-ic="chev" class="chev"></span>
      </button>
      <button class="row" id="privacy">
        <span data-ic="shield"></span><span class="grow">隐私与训练声明</span>
        <span data-ic="chev" class="chev"></span>
      </button>
      <div class="row">
        <span data-ic="bell"></span><span class="grow">回溯提醒</span>
        <button class="switch" id="remind" role="switch" aria-label="回溯提醒"></button>
      </div>
    </div>

    <div class="rows mt16">
      <button class="row" id="logout">
        <span data-ic="logout"></span><span class="grow">注销账号</span>
        <span data-ic="chev" class="chev"></span>
      </button>
    </div>

    <div class="t3 s12 mt24" style="text-align:center;line-height:2">
      知树 KnowTree<br />数据存储在你的 Supabase 账号中
    </div>
  </main>

  <div data-tabbar></div>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    (async function () {
      var remind = document.getElementById('remind');
      var statsEl = document.getElementById('stats');

      try {
        await KT.load();
      } catch (e) {
        statsEl.innerHTML = '<div class="t3 s13">加载失败 · <a href="login.html" style="color:var(--gold)">去登录</a></div>';
        return;
      }

      function render() {
        var s = KT.stats();
        statsEl.innerHTML =
          '<div class="stat"><div class="v">' + s.total + '</div><div class="k">收录</div></div>' +
          '<div class="stat"><div class="v">' + KT.NODES.length + '</div><div class="k">分类</div></div>' +
          '<div class="stat"><div class="v">' + s.week + '</div><div class="k">本周沉淀</div></div>';
        remind.classList.toggle('on', KT.getSetting('reviewReminder') !== false);
      }

      /* 数据导出：走后端 /export */
      document.getElementById('export').addEventListener('click', async function () {
        var btn = this;
        btn.disabled = true;
        try {
          await KT.exportFile('json');
          UI.toast('已导出全部知识（JSON）');
        } catch (e) {
          UI.toast('导出失败：' + e.message);
        }
        btn.disabled = false;
      });

      /* 隐私与训练声明 */
      document.getElementById('privacy').addEventListener('click', function () {
        UI.openSheet('隐私与训练声明', function (body) {
          body.innerHTML =
            '<div class="prose" style="font-size:14px">' +
            '<p>知识正文、分类与回溯记录都存在你自己的账号下（后端按 user_id 隔离，全表 RLS），前端只在本地保存登录凭证。</p>' +
            '<p>「AI 解析」「语义检索」「相似度」由后端模型服务完成，你的内容不会被用于训练。</p>' +
            '<p>在下方「注销账号」会调用后端 DELETE /me/account，彻底删除你的条目与账号，操作不可撤销。</p>' +
            '</div>';
        });
      });

      /* 回溯提醒：写回 profile.daily_recall_enabled */
      remind.addEventListener('click', async function () {
        var on = !(KT.getSetting('reviewReminder') !== false);
        try {
          await KT.setSetting('reviewReminder', on);
          render();
          UI.toast(on ? '已开启每日回溯' : '已关闭每日回溯');
        } catch (e) {
          UI.toast('保存失败：' + e.message);
        }
      });

      /* 注销账号：DELETE /me/account */
      document.getElementById('logout').addEventListener('click', function () {
        UI.confirm({
          title: '注销账号？',
          desc: '会调用后端彻底删除你的全部知识、分类与账号，操作不可撤销。',
          ok: '注销'
        }).then(async function (ok) {
          if (!ok) return;
          try {
            await KT.wipe();
          } catch (e) {
            UI.toast('注销失败：' + e.message);
            return;
          }
          var page = document.querySelector('.page');
          var tabHost = document.querySelector('[data-tabbar]');
          if (tabHost) tabHost.innerHTML = '';
          page.innerHTML =
            '<div style="min-height:80dvh;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
            '<div class="h-big">账号已注销</div>' +
            '<div class="t3 s13 mt8">服务端数据与登录凭证都已清除</div>' +
            '<a class="btn btn-primary mt24" style="min-width:180px" href="login.html">重新登录</a>' +
            '</div>';
        });
      });

      render();
    })();
  </script>
</body>
</html>
