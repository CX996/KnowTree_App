        <g class="tnode" data-node="" tabindex="0" role="link" aria-label="知识分类">
          <circle class="hit" cx="62" cy="82" r="28"/>
          <circle class="ring" cx="62" cy="82" r="23"/>
          <text class="cnt" x="62" y="83" data-cnt=""></text>
          <text class="lbl" x="62" y="123"></text>
        </g>
        <g class="tnode" data-node="" tabindex="0" role="link" aria-label="知识分类">
          <circle class="hit" cx="298" cy="82" r="28"/>
          <circle class="ring" cx="298" cy="82" r="23"/>
          <text class="cnt" x="298" y="83" data-cnt=""></text>
          <text class="lbl" x="298" y="123"></text>
        </g>
        <g class="tnode" data-node="" tabindex="0" role="link" aria-label="知识分类">
          <circle class="hit" cx="76" cy="240" r="30"/>
          <circle class="ring" cx="76" cy="240" r="25"/>
          <text class="cnt" x="76" y="241" data-cnt=""></text>
          <text class="lbl" x="76" y="283"></text>
        </g>

  <div class="cta-bar cta-bar--tab">
    <a class="btn btn-primary btn-block" href="capture.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>

  <div data-tabbar></div>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (async function () {
      var statsEl = document.getElementById('stats');
      try {
        await KT.load();
      } catch (e) {
        statsEl.innerHTML = '加载失败 · <a href="login.html" style="color:var(--gold)">去登录</a>';
        return;
      }

      /* 后端分类是动态的（含 parent_id），把分类按条目数从多到少铺到树的 7 个位置上 */
      var slots = Array.prototype.slice.call(document.querySelectorAll('.tnode'));
      var cats = KT.NODES.slice().sort(function (a, b) {
        return KT.countInNode(b.id) - KT.countInNode(a.id);
      });

      slots.forEach(function (g, i) {
        var cat = cats[i];
        if (!cat) { g.style.display = 'none'; return; }
        g.setAttribute('data-node', cat.id);
        g.setAttribute('aria-label', cat.name);
        var lbl = g.querySelector('.lbl');
        if (lbl) lbl.textContent = cat.name;
        var cnt = g.querySelector('.cnt');
        if (cnt) { cnt.textContent = KT.countInNode(cat.id); cnt.setAttribute('data-cnt', cat.id); }
        function open() { UI.go('library.html?category=' + encodeURIComponent(cat.id)); }
        g.addEventListener('click', open);
        g.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
      });

      function render() {
        statsEl.textContent = KT.NODES.length + ' 个分类 · ' + KT.classified().length + ' 条知识';
        var box = KT.inbox();
        var n = box.pending.length + box.dups.length;
        var banner = document.getElementById('inboxBanner');
        if (n > 0) {
          banner.hidden = false;
          document.getElementById('inboxNum').textContent = n;
        } else {
          banner.hidden = true;
        }
        document.querySelectorAll('[data-cnt]').forEach(function (t) {
          t.textContent = KT.countInNode(t.getAttribute('data-cnt'));
        });
      }

      render();
    })();
  </script>
</body>
</html>
