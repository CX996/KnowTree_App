<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110E" />
  <title>每日回溯 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/pages.css" />
  <link rel="stylesheet" href="assets/styles/shell.css" />
  <link rel="stylesheet" href="assets/styles/pet.css" />
</head>
<body data-tab="review" data-pet-mode="ambient">
  <main class="page page--bar app-page review-page">
    <header class="page-head">
      <div>
        <p class="page-kicker">DAILY RECALL</p>
        <h1>每日回顾</h1>
      </div>
      <div class="review-head-actions">
        <span class="page-head__meta" id="progress"></span>
        <button class="icon-btn" id="close" aria-label="关闭" data-ic="x"></button>
      </div>
    </header>
    <section class="review-stage" id="stage"></section>
    <div class="cta-bar review-actions" id="bar" hidden>
      <button class="btn btn-ghost" id="forgot">稍后再看</button>
      <button class="btn btn-primary" id="known">已理解</button>
    </div>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/shell.js"></script>
  <script type="module" src="assets/pet.js"></script>
  <script>
    (async function () {
      var stage = document.getElementById('stage');
      var bar = document.getElementById('bar');
      var progress = document.getElementById('progress');
      var queue = [];
      var idx = 0;

      document.getElementById('close').addEventListener('click', function () { UI.back('index.html'); });

      stage.innerHTML = UI.emptyHTML('加载中…', '正在取今天要回溯的知识');
      try {
        await KT.load();
        await KT.loadReview();
      } catch (e) {
        stage.innerHTML = KT.errorHTML(e);
        bar.hidden = true;
        return;
      }
      queue = KT.reviewQueue(3);

      function dots() {
        var html = '<div class="dots mt24">';
        for (var i = 0; i < queue.length; i++) {
          html += '<i class="' + (i === idx ? 'on' : '') + '"></i>';
        }
        return html + '</div><div class="t3 s12 mt8" style="text-align:center">' + (idx + 1) + ' / ' + queue.length + '</div>';
      }

      function render() {
        if (!queue.length) {
          progress.textContent = '';
          stage.innerHTML = '<div class="empty"><div class="t">今天没有需要回溯的知识</div><div>先丢几条进来，遗忘曲线会负责把它们送回来</div></div>' +
            '<a class="btn btn-primary btn-block mt16" href="index.html">回到知识树</a>';
          bar.hidden = true;
          return;
        }
        if (idx >= queue.length) {
          progress.textContent = queue.length + ' / ' + queue.length;
          stage.innerHTML = '<div style="text-align:center">' +
            '<div class="h-big">今天的看完了</div>' +
            '<div class="t3 s13 mt8">明天会按遗忘曲线再送 ' + Math.min(queue.length, 3) + ' 条过来</div></div>' +
            '<a class="btn btn-primary btn-block mt24" href="index.html">回到知识树</a>';
          bar.hidden = true;
          return;
        }
        var c = queue[idx];
        progress.textContent = (idx + 1) + ' / ' + queue.length;
        stage.innerHTML =
          '<article class="review-sheet">' +
            '<p class="page-kicker">' + UI.esc(KT.nodeName(c.nodeId)) + '</p>' +
            '<h2>' + UI.esc(c.title) + '</h2>' +
            '<p>' + UI.esc(c.summary) + '</p>' +
            '<div class="review-meta">收录于 ' + UI.timeAgo(c.createdAt) + '</div>' +
            '<a href="detail.html?id=' + encodeURIComponent(c.id) + '">查看全文 →</a>' +
          '</article>' + dots();
        bar.hidden = false;
      }

      async function grade(status) {
        var c = queue[idx];
        idx++;
        render();
        if (!c) return;
        try {
          await KT.markSeen(c.id, status);
          document.dispatchEvent(new CustomEvent('knowtree:request-success', {
            detail: { scope: 'review' }
          }));
        } catch (e) {
          UI.toast('回溯状态没存上：' + e.message);
        }
      }

      document.getElementById('known').addEventListener('click', function () { grade('done'); });
      document.getElementById('forgot').addEventListener('click', function () { grade('skipped'); });

      render();
    })();
  </script>
</body>
</html>
