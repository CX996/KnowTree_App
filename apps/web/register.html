<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>创建账号 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <main class="page page--auth">
    <a class="auth-brand" href="login.html" aria-label="返回登录">
      <span class="auth-brand__mark" aria-hidden="true"></span>
      <span>知树 KnowTree</span>
    </a>

    <div class="auth-hero mt32">
      <div class="auth-kicker">建立你的私人知识库</div>
      <h1 class="h-big mt12">从一个账号，<br />种下一棵树。</h1>
      <p class="t3 s13 mt12">注册后，把文章、笔记和文档交给知树整理。</p>
    </div>

    <form id="registerForm" class="auth-card mt24" novalidate>
      <label class="auth-label" for="email">邮箱</label>
      <input class="auth-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required />

      <label class="auth-label mt16" for="pwd">密码</label>
      <input class="auth-input" id="pwd" type="password" minlength="8" placeholder="至少 8 位，包含字母和数字" autocomplete="new-password" required />

      <label class="auth-label mt16" for="pwdConfirm">确认密码</label>
      <input class="auth-input" id="pwdConfirm" type="password" minlength="8" placeholder="再输入一次密码" autocomplete="new-password" required />

      <p class="auth-hint t3 s12 mt12">密码至少 8 位，并同时包含字母和数字。</p>
      <button class="btn btn-primary btn-block mt16" id="register" type="submit">创建账号</button>
    </form>

    <div class="auth-status t3 s12 mt16" id="msg" aria-live="polite"></div>
    <div class="auth-links mt16"><span>已有账号？</span><a href="login.html">直接登录</a></div>
    <div class="auth-note t3 s12 mt20">注册后需要打开邮箱完成验证。知树不会读取你的邮箱密码。</div>
  </main>

  <script src="assets/api.js"></script>
  <script type="module">
    import { safeNextPage, signUpWithPassword, validateNewPassword } from './assets/auth-client.js';

    const form = document.getElementById('registerForm');
    const button = document.getElementById('register');
    const message = (text) => { document.getElementById('msg').textContent = text || ''; };
    const next = safeNextPage(new URLSearchParams(location.search).get('next') || 'index.html');
    let config = null;

    KT.loadPublicConfig().then((value) => {
      config = value;
      message('服务已就绪');
    }, (error) => {
      message('服务未配置：' + error.message);
      button.disabled = true;
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('pwd').value;
      const confirmPassword = document.getElementById('pwdConfirm').value;
      const strength = validateNewPassword(password);
      if (!email) {
        message('请输入邮箱');
        document.getElementById('email').focus();
        return;
      }
      if (!strength.ok) {
        message(strength.message);
        document.getElementById('pwd').focus();
        return;
      }
      if (password !== confirmPassword) {
        message('两次输入的密码不一致');
        document.getElementById('pwdConfirm').focus();
        return;
      }
      if (!config) {
        message('服务仍在连接，请稍后重试');
        return;
      }

      button.disabled = true;
      message('正在创建账号…');
      const redirectTo = location.origin + '/login.html?confirmed=1&next=' + encodeURIComponent(next);
      try {
        const result = await signUpWithPassword(config, email, password, redirectTo);
        if (result.session) {
          KT.setToken(result.session.accessToken, result.session.refreshToken);
          location.replace(next);
          return;
        }
        form.hidden = true;
        message('注册成功，请打开邮箱完成验证，然后回来登录。');
      } catch (error) {
        button.disabled = false;
        message('注册失败：' + error.message);
      }
    });
  </script>
</body>
</html>
