<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>找回密码 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <main class="page page--auth">
    <a class="auth-brand" href="login.html" aria-label="返回登录">
      <span class="auth-brand__mark" aria-hidden="true"></span>
      <span>知树 KnowTree</span>
    </a>

    <div class="auth-hero mt32">
      <div class="auth-kicker">找回访问方式</div>
      <h1 class="h-big mt12">重新打开<br />你的知树。</h1>
      <p class="t3 s13 mt12">输入注册邮箱，我们会发送一封安全的重置链接。</p>
    </div>

    <form id="recoverForm" class="auth-card mt24" novalidate>
      <label class="auth-label" for="email">注册邮箱</label>
      <input class="auth-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required />
      <button class="btn btn-primary btn-block mt16" id="recover" type="submit">发送重置邮件</button>
    </form>

    <div class="auth-status t3 s12 mt16" id="msg" aria-live="polite"></div>
    <div class="auth-links mt16"><span>想起来了？</span><a href="login.html">返回登录</a></div>
    <div class="auth-note t3 s12 mt20">为了安全，无论邮箱是否存在，页面都会显示相同的发送结果。</div>
  </main>

  <script src="assets/api.js"></script>
  <script type="module">
    import { requestPasswordReset } from './assets/auth-client.js';

    const form = document.getElementById('recoverForm');
    const button = document.getElementById('recover');
    const message = (text) => { document.getElementById('msg').textContent = text || ''; };
    let config = null;

    KT.loadPublicConfig().then((value) => {
      config = value;
    }, (error) => {
      message('服务未配置：' + error.message);
      button.disabled = true;
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        message('请输入注册邮箱');
        document.getElementById('email').focus();
        return;
      }
      if (!config) {
        message('服务仍在连接，请稍后重试');
        return;
      }

      button.disabled = true;
      message('正在发送…');
      try {
        await requestPasswordReset(config, email, location.origin + '/reset-password.html');
        message('如果该邮箱已注册，重置链接将在几分钟内送达。');
      } catch (error) {
        message('发送失败：' + error.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
