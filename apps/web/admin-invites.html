<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110E" />
  <title>邀请管理 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/pages.css" />
  <link rel="stylesheet" href="assets/styles/shell.css" />
  <link rel="stylesheet" href="assets/styles/pet.css?v=20261105" />
  <link rel="stylesheet" href="assets/styles/transitions.css" />
</head>
<body data-tab="me" data-pet-mode="ambient">
  <main class="page page--tab app-page manage-page owner-page">
    <header class="page-head">
      <div>
        <p class="page-kicker">OWNER · INVITES</p>
        <h1>邀请管理</h1>
      </div>
      <span class="account-chip">7 天 · 一次性</span>
    </header>

    <section class="invite-create-card" aria-labelledby="inviteCreateTitle">
      <h2 id="inviteCreateTitle">邀请一位读者</h2>
      <p>邀请与邮箱绑定，只显示一次专属链接。被邀请者当前阶段以邀请作为访问凭证，邮箱仍标记为待验证。</p>
      <form id="inviteForm" class="invite-inline-form" novalidate>
        <label class="sr-only" for="inviteEmail">邀请邮箱</label>
        <input class="auth-input" id="inviteEmail" type="email" placeholder="reader@example.com" autocomplete="email" required />
        <button class="btn btn-primary" type="submit">创建邀请</button>
      </form>
      <div class="field-error" data-field-error="email"></div>
      <div id="inviteResult" class="invite-result" hidden aria-live="polite"></div>
      <div id="inviteError" class="error-slot" aria-live="polite"></div>
    </section>

    <section class="invite-list-section" aria-labelledby="inviteListTitle">
      <div class="section-heading">
        <div>
          <p class="page-kicker">AUDIT</p>
          <h2 id="inviteListTitle">最近邀请</h2>
        </div>
        <button class="text-link" id="refreshInvites" type="button">刷新</button>
      </div>
      <div class="invite-list" id="inviteList" aria-live="polite"></div>
      <div class="empty" id="inviteEmpty" hidden>还没有创建邀请。</div>
    </section>
  </main>

  <script src="assets/transitions.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/shell.js"></script>
  <script type="module" src="assets/pet.js?v=20261105"></script>
  <script type="module">
    import {
      createInvitation,
      listInvitations,
      revokeInvitation,
    } from './assets/account-client.mjs';
    import {
      bindErrorCopy,
      normalizeApiError,
      renderErrorCard,
    } from './assets/error-view.mjs';

    bindErrorCopy(document);

    var form = document.getElementById('inviteForm');
    var emailInput = document.getElementById('inviteEmail');
    var list = document.getElementById('inviteList');
    var empty = document.getElementById('inviteEmpty');
    var errorSlot = document.getElementById('inviteError');
    var result = document.getElementById('inviteResult');
    var STATUS = {
      active: '待使用',
      claimed: '处理中',
      used: '已使用',
      revoked: '已撤销',
      expired: '已过期',
      needs_attention: '需处理',
    };

    function esc(value) {
      return UI.esc(String(value == null ? '' : value));
    }

    function formatDate(value) {
      if (!value) return '—';
      return new Intl.DateTimeFormat('zh-CN', {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      }).format(new Date(value));
    }

    function renderList(items) {
      list.innerHTML = items.map(function (item) {
        return (
          '<article class="invite-row" data-id="' + esc(item.id) + '">' +
            '<div class="invite-row__main">' +
              '<h3>' + esc(item.email) + '</h3>' +
              '<p>创建 ' + esc(formatDate(item.createdAt)) + ' · 到期 ' + esc(formatDate(item.expiresAt)) + '</p>' +
            '</div>' +
            '<span class="invite-status invite-status--' + esc(item.status) + '">' +
              esc(STATUS[item.status] || item.status) +
            '</span>' +
            (['active', 'claimed', 'needs_attention'].includes(item.status)
              ? '<button class="mini-btn" type="button" data-invite-action="revoke" data-id="' + esc(item.id) + '">撤销</button>'
              : '') +
          '</article>'
        );
      }).join('');
      empty.hidden = items.length > 0;
    }

    async function reload() {
      errorSlot.innerHTML = '';
      try {
        renderList(await listInvitations());
      } catch (error) {
        list.innerHTML = '';
        empty.hidden = true;
        errorSlot.innerHTML = renderErrorCard(error, { title: '邀请列表加载失败' });
        bindErrorCopy(errorSlot);
        form.querySelector('[type="submit"]').disabled = true;
      }
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      form.querySelector('[data-field-error="email"]').textContent = '';
      errorSlot.innerHTML = '';
      result.hidden = true;
      var button = form.querySelector('[type="submit"]');
      button.disabled = true;
      try {
        var invitation = await createInvitation(emailInput.value.trim());
        emailInput.value = '';
        result.hidden = false;
        result.innerHTML =
          '<p><b>邀请已创建</b> · ' + esc(invitation.email) + '</p>' +
          '<code>' + esc(invitation.inviteUrl) + '</code>' +
          '<button class="btn btn-ghost btn-block mt12" type="button" data-invite-action="copy" data-link="' +
            esc(invitation.inviteUrl) + '">复制邀请链接</button>' +
          '<p class="t3 s12 mt8">关闭页面后无法再次查看这条链接，只能撤销后重新创建。</p>';
        await reload();
      } catch (error) {
        var safe = normalizeApiError(error);
        if (safe.fields && safe.fields.email) {
          form.querySelector('[data-field-error="email"]').textContent = safe.fields.email;
        }
        errorSlot.innerHTML = renderErrorCard(safe);
        bindErrorCopy(errorSlot);
      } finally {
        button.disabled = false;
      }
    });

    document.addEventListener('click', async function (event) {
      var action = event.target.closest('[data-invite-action]');
      if (!action) return;
      if (action.getAttribute('data-invite-action') === 'copy') {
        try {
          await navigator.clipboard.writeText(action.getAttribute('data-link'));
          action.textContent = '邀请链接已复制';
          UI.toast('邀请链接已复制');
        } catch (error) {
          UI.toast('复制失败，请手动选择链接');
        }
        return;
      }
      if (action.getAttribute('data-invite-action') === 'revoke') {
        var ok = await UI.confirm({
          title: '撤销这条邀请？',
          desc: '撤销后链接立即失效。已经使用的邀请不受影响。',
          ok: '撤销邀请',
        });
        if (!ok) return;
        try {
          await revokeInvitation(action.getAttribute('data-id'));
          await reload();
          UI.toast('邀请已撤销');
        } catch (error) {
          UI.toast(UI.safeError(error));
        }
      }
    });

    document.getElementById('refreshInvites').addEventListener('click', reload);
    reload();
  </script>
</body>
</html>
