<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>登录 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <main class="page page--auth">
    <div class="topbar">
      <div class="grow">
        <h1 class="h-big">回到你的知树</h1>
        <div class="t3 s13">用已开通的邮箱账号登录</div>
      </div>
    </div>

    <form id="loginForm" class="mt24" novalidate>
      <label class="t3 s12" for="email">邮箱</label>
      <input class="textarea mt8" id="email" type="email" style="min-height:48px" placeholder="name@example.com" autocomplete="email" required />

      <label class="t3 s12 mt16" for="pwd">密码</label>
      <input class="textarea mt8" id="pwd" type="password" style="min-height:48px" placeholder="输入密码" autocomplete="current-password" required />

      <button class="btn btn-primary btn-block mt16" id="login" type="submit">登录</button>
    </form>
    <div class="t3 s12 mt20" id="msg" aria-live="polite"></div>
    <div class="t3 s12 mt12">账号目前由管理员预先创建。登录凭证只保存在当前浏览器的本地存储中。</div>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    (function () {
      function el(id) { return document.getElementById(id); }
      var requestedNext = UI.q('next') || 'index.html';
      var next = /^[A-Za-z0-9_-]+\.html(?:\?.*)?$/.test(requestedNext) ? requestedNext : 'index.html';
      var form = el('loginForm');
      var button = el('login');

      function msg(text) { el('msg').textContent = text || ''; }

      KT.loadPublicConfig().then(function () {
        msg('服务已就绪');
      }, function (error) {
        msg('服务未配置：' + error.message);
        button.disabled = true;
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var email = el('email').value.trim();
        var password = el('pwd').value;
        if (!email || !password) {
          msg('请输入邮箱和密码');
          (!email ? el('email') : el('pwd')).focus();
          return;
        }
        button.disabled = true;
        msg('登录中…');
        KT.loginWithPassword(email, password).then(function () {
          location.replace(next);
        }, function (error) {
          button.disabled = false;
          msg('登录失败：' + error.message);
        });
      });
    })();
  </script>
</body>
</html>
