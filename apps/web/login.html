<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>登录 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="page page--auth">
    <div class="topbar">
      <div class="grow">
        <h1 class="h-big">回到你的知树</h1>
        <div class="t3 s13">用已开通的邮箱账号登录</div>
      </div>
    </div>

    <input class="textarea mt24" id="email" style="min-height:48px" placeholder="邮箱" autocomplete="username" />
    <input class="textarea mt8" id="pwd" type="password" style="min-height:48px" placeholder="密码" autocomplete="current-password" />
    <button class="btn btn-primary btn-block mt16" id="login">登录</button>
    <div class="t3 s12 mt20" id="msg" aria-live="polite"></div>
    <div class="t3 s12 mt12">账号目前由管理员预先创建。登录凭证只保存在当前浏览器的本地存储中。</div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    (function () {
      function el(id) { return document.getElementById(id); }
      var requestedNext = UI.q('next') || 'index.html';
      var next = /^[A-Za-z0-9_-]+\.html(?:\?.*)?$/.test(requestedNext) ? requestedNext : 'index.html';
      var button = el('login');

      function msg(text) { el('msg').textContent = text || ''; }

      KT.loadPublicConfig().then(function () {
        msg('服务已就绪');
      }, function (error) {
        msg('服务未配置：' + error.message);
        button.disabled = true;
      });

      el('login').addEventListener('click', function () {
        var email = el('email').value.trim();
        var password = el('pwd').value;
        button.disabled = true;
        msg('登录中…');
        KT.loginWithPassword(email, password).then(function () {
          location.replace(next);
        }, function (error) {
          button.disabled = false;
          msg('登录失败：' + error.message);
        });
      });
    })();
  </script>
</body>
</html>
