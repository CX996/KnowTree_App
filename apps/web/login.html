<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110E" />
  <title>登录 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/pages.css" />
  <link rel="stylesheet" href="assets/styles/transitions.css" />
</head>
<body>
  <main class="page page--auth auth-layout">
    <section class="auth-story">
      <a class="auth-brand" href="login.html" aria-label="知树 KnowTree">
        <span class="auth-brand__mark" aria-hidden="true"></span>
        <span>知树 KnowTree</span>
      </a>
      <div class="auth-kicker">回到你的知识树</div>
      <h1 id="authTitle">让读过的，<br />重新长回来。</h1>
      <p>登录后继续收录、整理与回溯。</p>
    </section>

    <section class="auth-panel" aria-labelledby="authTitle">
      <form id="loginForm" class="auth-card" novalidate>
        <label class="auth-label" for="email">邮箱</label>
        <input class="auth-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required />

        <label class="auth-label mt16" for="pwd">密码</label>
        <input class="auth-input" id="pwd" type="password" placeholder="输入密码" autocomplete="current-password" required />

        <button class="btn btn-primary btn-block mt16" id="login" type="submit">登录</button>
      </form>
      <div class="auth-status t3 s12 mt16" id="msg" aria-live="polite"></div>
      <div class="auth-links mt16">
        <a href="register.html">创建账号</a>
        <span aria-hidden="true">·</span>
        <a href="forgot-password.html">忘记密码</a>
      </div>
      <div class="auth-note t3 s12 mt20">登录凭证只保存在当前浏览器；知识内容保存在你的 Supabase 账号中。</div>
    </section>
  </main>

  <script src="assets/transitions.js"></script>
  <script src="assets/api.js"></script>
  <script type="module">
    import { parseAuthCallback, safeNextPage } from './assets/auth-client.js';

    const form = document.getElementById('loginForm');
    const button = document.getElementById('login');
    const message = (text) => { document.getElementById('msg').textContent = text || ''; };
    const requestedNext = new URLSearchParams(location.search).get('next');
    const next = safeNextPage(requestedNext || 'index.html');
    const callback = parseAuthCallback(location.hash);

    if (callback.errorDescription) {
      message('登录链接已失效：' + callback.errorDescription);
    } else if (callback.accessToken) {
      KT.setToken(callback.accessToken, callback.refreshToken);
      history.replaceState(null, '', location.pathname + location.search);
      location.replace(next);
    } else if (new URLSearchParams(location.search).get('confirmed') === '1') {
      message('邮箱验证成功，请输入密码登录');
    }

    KT.loadPublicConfig().then(() => {
      if (!callback.accessToken && !callback.errorDescription) message('服务已就绪');
    }, (error) => {
      message('服务暂时不可用：' + error.message);
      button.disabled = true;
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('pwd').value;
      if (!email || !password) {
        message('请输入邮箱和密码');
        (!email ? document.getElementById('email') : document.getElementById('pwd')).focus();
        return;
      }
      button.disabled = true;
      message('登录中…');
      KT.loginWithPassword(email, password).then(() => {
        location.replace(next);
      }, (error) => {
        button.disabled = false;
        message('登录失败：' + error.message);
      });
    });
  </script>
</body>
</html>
