<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110E" />
  <title>详情 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/pages.css" />
</head>
<body>
  <main class="page page--bar">
    <div class="topbar">
      <button class="icon-btn" id="back" aria-label="返回" data-ic="back"></button>
      <div class="grow"></div>
    </div>

    <div id="main"></div>

    <section class="edit-pane" id="editPane" aria-label="编辑知识" hidden>
      <label class="t3 s12" for="editTitle">标题</label>
      <input class="textarea mt8" id="editTitle" type="text" maxlength="200" />

      <label class="t3 s12 mt16" for="editSummary">摘要</label>
      <textarea class="textarea textarea--summary mt8" id="editSummary" maxlength="300"></textarea>

      <label class="t3 s12 mt16" for="editContent">正文 Markdown</label>
      <textarea class="textarea textarea--source mt8" id="editContent"></textarea>

      <div class="h-sec mt24 mb12">预览</div>
      <article class="markdown-body markdown-body--preview" id="preview"></article>

      <div class="edit-actions mt20">
        <button class="btn btn-ghost" id="cancelEdit" type="button">取消</button>
        <button class="btn btn-primary" id="saveBtn" type="button">保存修改</button>
      </div>
    </section>

    <div class="actionbar" id="actionbar" hidden>
      <button id="editBtn"><span data-ic="edit"></span><span>编辑</span></button>
      <button id="moveBtn"><span data-ic="move"></span><span>改节点</span></button>
      <button id="delBtn"><span data-ic="trash"></span><span>删除</span></button>
    </div>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script type="module">
    import { renderMarkdown } from './assets/markdown.js';

    const KT = window.KT;
    const UI = window.UI;
    const id = UI.q('id');
    const main = document.getElementById('main');
    const actionbar = document.getElementById('actionbar');
    const editPane = document.getElementById('editPane');
    const editTitle = document.getElementById('editTitle');
    const editSummary = document.getElementById('editSummary');
    const editContent = document.getElementById('editContent');
    const preview = document.getElementById('preview');
    const saveBtn = document.getElementById('saveBtn');
    let dirty = false;
    let editing = false;

    function sourceLabel(source) {
      return {
        ai: 'AI 整理',
        fallback: '规则整理',
        manual: '手动编辑',
        imported: '文档导入',
        legacy: '历史内容'
      }[source] || '';
    }

    function leave() {
      try {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
          history.back();
          return;
        }
      } catch (error) {
        /* fall through */
      }
      location.href = 'library.html';
    }

    document.getElementById('back').addEventListener('click', leave);

    main.innerHTML = UI.emptyHTML('加载中…', '正在取这条知识');
    try {
      await KT.load();
      await KT.loadDetail(id);
    } catch (error) {
      main.innerHTML = KT.errorHTML(error);
      actionbar.hidden = true;
      throw error;
    }

    function card() {
      return KT.byId(id);
    }

    function statusBanner(cardValue) {
      if (cardValue.status === 'pending' || cardValue.status === 'processing') {
        const message = cardValue.status === 'processing'
          ? '解析中，稍后自动归类'
          : cardValue.suggestedNode
            ? '建议挂到「' + UI.esc(KT.nodeName(cardValue.suggestedNode)) + '」 · 置信度 ' +
              (typeof cardValue.confidence === 'number' ? cardValue.confidence.toFixed(2) : '—')
            : '尚未确定分类 · 去收件箱确认';
        return '<a class="banner mt16" href="inbox.html"><span data-ic="bell"></span>' +
          '<span class="grow">' + message +
          '</span><span data-ic="chev" style="color:var(--gold)"></span></a>';
      }
      if (cardValue.status === 'dup') {
        const target = cardValue.dupOf ? KT.byId(cardValue.dupOf) : null;
        return '<a class="banner mt16" href="inbox.html"><span data-ic="merge"></span>' +
          '<span class="grow">疑似与' + (target ? '《' + UI.esc(target.title) + '》' : '已有条目') +
          '重复 · 相似度 ' + (typeof cardValue.sim === 'number' ? cardValue.sim.toFixed(2) : '—') +
          '</span><span data-ic="chev" style="color:var(--gold)"></span></a>';
      }
      return '';
    }

    function bodyMarkdown(current) {
      const raw = String(current.rawContent || '');
      const match = raw.match(/^(#[ \t]+.+?)(?:\n{2,}|\n?$)/);
      if (match) {
        const heading = match[1].replace(/^#[ \t]+/, '').trim();
        if (heading === String(current.title || '').trim()) {
          return raw.slice(match[0].length);
        }
      }
      return raw;
    }

    function render() {
      const current = card();
      if (!current || current.deleted) {
        main.innerHTML = UI.emptyHTML('这条知识不存在或已删除', '去知识库看看其他的');
        actionbar.hidden = true;
        return;
      }

      let html = '';
      html += current.nodeId
        ? '<a class="t3 s13" href="library.html?category=' + encodeURIComponent(current.nodeId) + '">知识库 / ' + UI.esc(KT.nodeName(current.nodeId)) + '</a>'
        : '<span class="t3 s13">未归类</span>';
      html += '<h1 class="h-big mt8" id="detailTitle">' + UI.esc(current.title) + '</h1>';
      html += '<div class="detail-meta t3 s12 mt8">' +
        '<span>' + UI.esc(current.source || '手动丢入') + '</span>' +
        '<span>' + UI.timeAgo(current.createdAt) + '</span>' +
        (sourceLabel(current.titleSource) ? '<span class="source-badge">' + sourceLabel(current.titleSource) + '</span>' : '') +
        '</div>';
      html += statusBanner(current);
      if (current.summary) {
        html += '<div class="quote detail-summary">' + UI.esc(current.summary) + '</div>';
      }
      html += '<article class="markdown-body mt20">' + renderMarkdown(bodyMarkdown(current)) + '</article>';
      html += '<div class="detail-tools mt20"><button class="text-btn" id="retryEnrich" type="button">重新整理标题和摘要</button></div>';

      if (current.tags && current.tags.length) {
        html += '<div class="card__meta mt8">' +
          current.tags.map((tag) => '<span class="tag">' + UI.esc(tag) + '</span>').join('') +
          '</div>';
      }

      const related = (current.links || [])
        .map((link) => ({ link, target: KT.byId(link.to) }))
        .filter((item) => item.target && !item.target.deleted);
      if (related.length) {
        html += '<div class="mt24"><div class="h-sec mb12">相关</div><div class="rows">' +
          related.map((item) =>
            '<button class="rel-row" data-to="' + item.target.id + '">' +
              '<span data-ic="link" style="color:var(--text3);flex:none;width:18px;height:18px"></span>' +
              '<span class="t">' + UI.esc(item.target.title) + '</span>' +
              '<span class="sim">相似度 ' + Number(item.link.sim || 0).toFixed(2) + '</span>' +
            '</button>').join('') +
          '</div></div>';
      }

      main.innerHTML = html;
      main.hidden = false;
      actionbar.hidden = false;
      UI.hydrateIcons(main);

      main.querySelectorAll('.rel-row').forEach((row) => {
        row.addEventListener('click', () => {
          UI.go('detail.html?id=' + encodeURIComponent(row.getAttribute('data-to')));
        });
      });
      document.getElementById('retryEnrich').addEventListener('click', retryEnrich);
    }

    function updatePreview() {
      preview.innerHTML = renderMarkdown(editContent.value);
    }

    function markDirty() {
      dirty = true;
    }

    function openEditor() {
      const current = card();
      if (!current) return;
      editTitle.value = current.title || '';
      editSummary.value = current.summary || '';
      editContent.value = current.rawContent || '';
      updatePreview();
      dirty = false;
      editing = true;
      main.hidden = true;
      actionbar.hidden = true;
      editPane.hidden = false;
      editTitle.focus();
    }

    async function closeEditor(force) {
      if (!force && dirty) {
        const ok = await UI.confirm({
          title: '放弃修改？',
          desc: '刚刚编辑的标题、摘要或正文尚未保存。',
          ok: '放弃'
        });
        if (!ok) return;
      }
      editing = false;
      dirty = false;
      editPane.hidden = true;
      main.hidden = false;
      actionbar.hidden = false;
    }

    async function save() {
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中…';
      try {
        await KT.updateEntry(id, {
          title: editTitle.value,
          summary: editSummary.value,
          content: editContent.value
        });
        dirty = false;
        editing = false;
        editPane.hidden = true;
        main.hidden = false;
        render();
        UI.toast('修改已保存');
      } catch (error) {
        UI.toast(error.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存修改';
      }
    }

    async function retryEnrich() {
      const button = document.getElementById('retryEnrich');
      if (!button) return;
      button.disabled = true;
      button.textContent = '正在重新整理…';
      try {
        await KT.enrichEntry(id);
        try { await KT.refreshEntry(id); } catch (error) { /* keep cached */ }
        render();
        UI.toast('已重新整理');
      } catch (error) {
        button.disabled = false;
        button.textContent = '重新整理标题和摘要';
        UI.toast(error.message);
      }
    }

    document.getElementById('editBtn').addEventListener('click', openEditor);
    document.getElementById('cancelEdit').addEventListener('click', () => closeEditor(false));
    saveBtn.addEventListener('click', save);
    editTitle.addEventListener('input', markDirty);
    editSummary.addEventListener('input', markDirty);
    editContent.addEventListener('input', () => {
      markDirty();
      updatePreview();
    });
    window.addEventListener('beforeunload', (event) => {
      if (!editing || !dirty) return;
      event.preventDefault();
      event.returnValue = '';
    });

    document.getElementById('moveBtn').addEventListener('click', () => {
      const current = card();
      if (!current) return;
      UI.nodePicker(current.nodeId || current.suggestedNode || null).then(async (nodeId) => {
        if (!nodeId) return;
        try {
          await KT.assign(id, nodeId);
          render();
          UI.toast('已挂到「' + KT.nodeName(nodeId) + '」');
        } catch (error) {
          UI.toast(error.message);
        }
      });
    });

    document.getElementById('delBtn').addEventListener('click', () => {
      UI.confirm({
        title: '删除这条知识？',
        desc: '删除后，这条知识不再出现在知识库中。',
        ok: '删除'
      }).then(async (ok) => {
        if (!ok) return;
        try {
          await KT.removeCard(id);
          UI.flash('已删除');
          location.replace('library.html');
        } catch (error) {
          UI.toast(error.message);
        }
      });
    });

    render();
  </script>
</body>
</html>
