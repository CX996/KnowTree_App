<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110E" />
  <title>知识库 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/pages.css" />
  <link rel="stylesheet" href="assets/styles/shell.css" />
</head>
<body data-tab="lib">
  <main class="page page--tab">
    <div class="topbar">
      <div class="grow">
        <h1 class="h-big">知识库</h1>
      </div>
    </div>

    <a class="searchbar mt8" href="search.html">
      <span data-ic="search"></span>
      <span style="font-size:15px">搜索标题、标签或正文</span>
    </a>

    <div class="seg mt16" id="seg">
      <button data-f="all" class="on">全部 <span class="n"></span></button>
      <button data-f="pending">待确认 <span class="n"></span></button>
      <button data-f="uncategorized">未分类 <span class="n"></span></button>
    </div>

    <label class="t3 s12 mt16" for="categoryFilter">按分类筛选</label>
    <select class="textarea mt8" id="categoryFilter" style="min-height:48px">
      <option value="">全部分类</option>
    </select>

    <div class="mt16" id="list"></div>
  </main>

  <div data-tabbar></div>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (async function () {
      var filter = 'all';
      var seg = document.getElementById('seg');
      var list = document.getElementById('list');
      var categoryFilter = document.getElementById('categoryFilter');
      var requestedCategory = UI.q('category') || '';

      list.innerHTML = UI.emptyHTML('加载中…', '正在从后端取知识库');
      try {
        await KT.load();
      } catch (e) {
        list.innerHTML = KT.errorHTML(e);
        return;
      }

      function counts() {
        var box = KT.inbox();
        return {
          all: KT.visible().length,
          pending: box.pending.length + box.dups.length,
          uncategorized: KT.uncategorized().length
        };
      }

      function syncSegments() {
        seg.querySelectorAll('button').forEach(function (button) {
          button.classList.toggle('on', button.getAttribute('data-f') === filter);
        });
      }

      function render() {
        var c = counts();
        seg.querySelector('[data-f="all"] .n').textContent = c.all;
        seg.querySelector('[data-f="pending"] .n').textContent = c.pending;
        seg.querySelector('[data-f="uncategorized"] .n').textContent = c.uncategorized;

        var cards;
        if (filter === 'pending') {
          var box = KT.inbox();
          cards = box.pending.concat(box.dups);
        } else if (filter === 'uncategorized') {
          cards = KT.uncategorized();
        } else {
          cards = KT.visible();
        }

        if (categoryFilter.value) {
          cards = cards.filter(function (card) {
            return card.nodeId === categoryFilter.value;
          });
        }

        if (!cards.length) {
          list.innerHTML = filter === 'uncategorized'
            ? UI.emptyHTML('没有未分类的条目', '待确认的条目处理完就会归到分类下')
            : UI.emptyHTML('这里空空如也', '丢一条进来，系统会试着挂到树上');
          return;
        }
        list.innerHTML = cards.map(UI.cardHTML).join('');
      }

      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        filter = b.getAttribute('data-f');
        syncSegments();
        render();
      });

      KT.NODES.forEach(function (node) {
        var option = document.createElement('option');
        option.value = node.id;
        option.textContent = node.name;
        categoryFilter.appendChild(option);
      });

      categoryFilter.value = KT.NODES.some(function (node) {
        return node.id === requestedCategory;
      }) ? requestedCategory : '';

      categoryFilter.addEventListener('change', function () {
        filter = 'all';
        syncSegments();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
