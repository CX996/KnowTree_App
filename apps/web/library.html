<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110E" />
  <title>知识库 · 知树 KnowTree</title>
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/pages.css" />
  <link rel="stylesheet" href="assets/styles/shell.css" />
  <link rel="stylesheet" href="assets/styles/pet.css" />
</head>
<body data-tab="lib" data-pet-mode="ambient">
  <main class="page app-page knowledge-page">
    <header class="page-head">
      <div>
        <p class="page-kicker">ALL KNOWLEDGE</p>
        <h1>知识库</h1>
      </div>
      <a class="icon-btn" href="search.html" aria-label="搜索知识" data-ic="search"></a>
    </header>
    <div class="filter-scroll" id="categoryRail" role="group" aria-label="按分类筛选"></div>
    <div class="status-switch" id="seg" role="tablist" aria-label="知识状态">
      <button data-f="all" role="tab" aria-selected="true">全部 <span class="n"></span></button>
      <button data-f="pending" role="tab" aria-selected="false">待确认 <span class="n"></span></button>
      <button data-f="uncategorized" role="tab" aria-selected="false">未分类 <span class="n"></span></button>
    </div>
    <section class="knowledge-list" id="list" aria-live="polite"></section>
  </main>

  <script src="assets/api.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/shell.js"></script>
  <script type="module" src="assets/pet.js"></script>
  <script type="module">
    import {
      resolveCategory,
      nextFilterOnCategoryChange,
      updateCategorySelection
    } from './assets/library-state.mjs';

    (async function () {
      var filter = 'all';
      var seg = document.getElementById('seg');
      var list = document.getElementById('list');
      var categoryRail = document.getElementById('categoryRail');
      var requestedCategory = UI.q('category') || '';
      var selectedCategory = '';

      list.innerHTML = UI.emptyHTML('加载中…', '正在从后端取知识库');
      try {
        await KT.load();
      } catch (e) {
        list.innerHTML = KT.errorHTML(e);
        return;
      }

      selectedCategory = resolveCategory(KT.NODES, requestedCategory);

      function counts() {
        var box = KT.inbox();
        return {
          all: KT.visible().length,
          pending: box.pending.length + box.dups.length,
          uncategorized: KT.uncategorized().length
        };
      }

      function syncSegments() {
        seg.querySelectorAll('button').forEach(function (button) {
          button.classList.toggle('on', button.getAttribute('data-f') === filter);
          button.setAttribute('aria-selected', String(button.getAttribute('data-f') === filter));
        });
      }

      function renderCategoryRail() {
        var items = [{ id: '', name: '全部', count: KT.visible().length }]
          .concat(KT.NODES.map(function (node) {
            return { id: node.id, name: node.name, count: KT.countInNode(node.id) };
          }));
        categoryRail.innerHTML = items.map(function (item) {
          var active = item.id === selectedCategory;
          return '<button class="filter-chip' + (active ? ' is-active' : '') + '" ' +
            'data-category="' + UI.esc(item.id) + '" aria-pressed="' + active + '">' +
            UI.esc(item.name) + '<span>' + item.count + '</span></button>';
        }).join('');
      }

      function render() {
        var c = counts();
        seg.querySelector('[data-f="all"] .n').textContent = c.all;
        seg.querySelector('[data-f="pending"] .n').textContent = c.pending;
        seg.querySelector('[data-f="uncategorized"] .n').textContent = c.uncategorized;

        var cards;
        if (filter === 'pending') {
          var box = KT.inbox();
          cards = box.pending.concat(box.dups);
        } else if (filter === 'uncategorized') {
          cards = KT.uncategorized();
        } else {
          cards = KT.visible();
        }

        if (selectedCategory) {
          cards = cards.filter(function (card) {
            return card.nodeId === selectedCategory;
          });
        }

        if (!cards.length) {
          list.innerHTML = filter === 'uncategorized'
            ? UI.emptyHTML('没有未分类的条目', '待确认的条目处理完就会归到分类下')
            : UI.emptyHTML('这里空空如也', '丢一条进来，系统会试着挂到树上');
          return;
        }
        list.innerHTML = cards.map(UI.cardHTML).join('');
      }

      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        filter = b.getAttribute('data-f');
        syncSegments();
        render();
      });

      categoryRail.addEventListener('click', function (e) {
        var button = e.target.closest('[data-category]');
        if (!button) return;
        selectedCategory = button.getAttribute('data-category');
        filter = nextFilterOnCategoryChange();
        syncSegments();
        updateCategorySelection(
          categoryRail.querySelectorAll('[data-category]'),
          selectedCategory
        );
        render();
      });

      syncSegments();
      renderCategoryRail();
      render();
    })();
  </script>
</body>
</html>
