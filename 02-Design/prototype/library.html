<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>知识库 · 知树</title>
<link rel="stylesheet" href="./theme.css">
</head>
<body data-page-id="library">
<div class="app">
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="app-header">
    <div class="head-row">
      <div>
        <h1 class="head-title">知识库</h1>
        <p class="head-sub">按收录时间倒序 · 最新的在最上面</p>
      </div>
    </div>
    <a class="search-trigger" href="./search.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M16 16l4.5 4.5"></path>
      </svg>
      搜索知识、标签、原文
    </a>
  </header>

  <main id="main-content" tabindex="-1" class="screen-body">
    <div class="seg" id="seg" role="tablist" aria-label="筛选知识库" style="margin-top:14px">
      <button type="button" role="tab" data-filter="all" aria-selected="true" aria-controls="list">全部</button>
      <button type="button" role="tab" data-filter="confirm" aria-selected="false" aria-controls="list">待确认</button>
      <button type="button" role="tab" data-filter="fav" aria-selected="false" aria-controls="list">收藏</button>
    </div>

    <div class="scroll" style="margin-top:12px">
      <div id="list" data-anchor-id="library.filter"></div>
    </div>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <a class="tab" href="./index.html" data-tab-target="tree">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21v-7"></path>
        <path d="M12 14c-3.3 0-6-2.7-6-6 3.3 0 6 2.7 6 6z"></path>
        <path d="M12 16c3.3 0 6-2.7 6-6-3.3 0-6 2.7-6 6z"></path>
      </svg>
      知识树
    </a>
    <a class="tab" href="./library.html" data-tab-target="library" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5z"></path>
        <path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"></path>
      </svg>
      知识库
    </a>
    <a class="tab" href="./me.html" data-tab-target="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"></path>
      </svg>
      我的
    </a>
  </nav>
</div>
<script src="./app.js"></script>
</body>
</html>
