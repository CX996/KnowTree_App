<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>我的 · 知树</title>
<link rel="stylesheet" href="./theme.css">
</head>
<body data-page-id="me">
<div class="app">
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="app-header">
    <div class="head-row">
      <div>
        <h1 class="head-title">我的</h1>
        <p class="head-sub">树龄 47 天 · 每天 21:30 送回</p>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="screen-body">
    <div class="scroll" style="margin-top:14px">

      <section class="card">
        <div class="mascot-row">
          <svg class="mascot" viewBox="0 0 80 80" role="img" aria-label="吉祥物：一只金线描边的小黑狐">
            <circle cx="40" cy="40" r="38" fill="#121210" stroke="rgba(201,169,107,.35)" stroke-width="1.2"></circle>
            <path d="M25 31L21 14l12 8z" fill="#0E0E0C" stroke="#C9A96B" stroke-width="1.2" stroke-linejoin="round"></path>
            <path d="M55 31l4-17-12 8z" fill="#0E0E0C" stroke="#C9A96B" stroke-width="1.2" stroke-linejoin="round"></path>
            <path d="M22 34c0-9 8-13 18-13s18 4 18 13c0 10-6 18-12 21l-6 5-6-5c-6-3-12-11-12-21z" fill="#15150F" stroke="#C9A96B" stroke-width="1.2"></path>
            <path d="M30 37q5 4 10 0" fill="none" stroke="#C9A96B" stroke-width="1.4" stroke-linecap="round"></path>
            <path d="M50 37q-5 4-10 0" fill="none" stroke="#C9A96B" stroke-width="1.4" stroke-linecap="round"></path>
            <path d="M37 45h6l-3 3z" fill="#C9A96B"></path>
            <path d="M40 24l2.2 4.2-2.2 3-2.2-3z" fill="#C9A96B" opacity=".85"></path>
          </svg>
          <div>
            <div style="font-size:15px;font-weight:500">小树在长</div>
            <div class="dim" style="font-size:11.5px;margin-top:4px;line-height:1.6">这个月你把它往前推了 9 次。<br>不着急，知识是长出来的。</div>
          </div>
        </div>
        <div class="stat-grid">
          <div><strong id="stat-total">11</strong><span>收录</span></div>
          <div><strong id="stat-nodes">7</strong><span>节点</span></div>
          <div><strong id="stat-week">9</strong><span>已入树</span></div>
        </div>
      </section>

      <div class="group-title">数据与隐私</div>
      <button type="button" class="row" id="export">
        <span>导出全部<span class="row-note">Markdown + JSON，原文一起带走</span></span>
        <span class="chev" aria-hidden="true">→</span>
      </button>
      <button type="button" class="row" id="trash">
        <span>回收站<span class="row-note">删除的卡片保留 30 天</span></span>
        <span class="chev" aria-hidden="true">→</span>
      </button>
      <button type="button" class="row" id="privacy">
        <span>隐私与训练声明<span class="row-note">默认不用于模型训练</span></span>
        <span class="chev" aria-hidden="true">→</span>
      </button>

      <div class="group-title">提醒</div>
      <button type="button" class="row" id="reminder">
        <span>回溯提醒<span class="row-note">每天 21:30 · 最多 3 张</span></span>
        <span class="chev" aria-hidden="true">→</span>
      </button>

      <div class="group-title">演示</div>
      <button type="button" class="row" id="reset">
        <span>重置演示数据<span class="row-note">恢复初始的 11 条卡片</span></span>
        <span class="chev" aria-hidden="true">→</span>
      </button>
      <button type="button" class="row" id="logout" style="color:#C97A66">
        <span>注销账号<span class="row-note">清空全部数据，不可恢复</span></span>
        <span class="chev" aria-hidden="true">→</span>
      </button>

      <p class="hint" style="margin-top:24px">知树 KnowTree · 原型 v0.1</p>
    </div>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <a class="tab" href="./index.html" data-tab-target="tree">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21v-7"></path>
        <path d="M12 14c-3.3 0-6-2.7-6-6 3.3 0 6 2.7 6 6z"></path>
        <path d="M12 16c3.3 0 6-2.7 6-6-3.3 0-6 2.7-6 6z"></path>
      </svg>
      知识树
    </a>
    <a class="tab" href="./library.html" data-tab-target="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5z"></path>
        <path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"></path>
      </svg>
      知识库
    </a>
    <a class="tab" href="./me.html" data-tab-target="me" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"></path>
      </svg>
      我的
    </a>
  </nav>
</div>
<script src="./app.js"></script>
</body>
</html>
