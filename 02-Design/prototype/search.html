<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>搜索 · 知树</title>
<link rel="stylesheet" href="./theme.css">
</head>
<body data-page-id="search">
<div class="app">
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="nav-bar" style="gap:12px">
    <a class="back" href="./index.html" aria-label="返回知识树">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 6l-6 6 6 6"></path>
      </svg>
    </a>
    <div style="flex:1;display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border-radius:14px;border:1px solid rgba(201,169,107,.32);background:#141416">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#C9A96B" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M16 16l4.5 4.5"></path>
      </svg>
      <input id="q" type="search" placeholder="搜标题、摘要、标签、原文" aria-label="搜索知识" autocomplete="off" autofocus
             style="flex:1;min-width:0;background:none;border:0;color:#F4F1EA;font-size:13px;font-family:inherit;outline:none">
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="screen-body">
    <div id="node-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"></div>
    <div class="section-title"><strong id="search-summary">最近收录</strong><span>实时过滤</span></div>
    <div class="scroll">
      <div id="results"></div>
    </div>
  </main>
</div>
<script src="./app.js"></script>
</body>
</html>
