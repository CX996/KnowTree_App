<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>丢一条 · 知树</title>
<link rel="stylesheet" href="./theme.css">
</head>
<body data-page-id="compose">
<div class="app">
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="nav-bar">
    <a class="back" href="./index.html" aria-label="取消收录，回到知识树">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </a>
    <span class="nav-title">收录</span>
  </header>

  <main id="main-content" tabindex="-1" class="screen-body" style="padding:0">
    <div class="compose-body">
      <div class="compose-handle" aria-hidden="true"></div>
      <h1 class="compose-title">丢进来</h1>
      <p class="compose-sub">不用选分类，也不用填标题</p>

      <label for="compose-text" class="skip-link" style="position:static;padding:0;background:none">内容</label>
      <textarea id="compose-text" class="compose-area" placeholder="粘贴一段文字、一条链接、一段想法……&#10;比如：PPO 的 clip 其实裁的是重要性采样比，不是优势函数。"></textarea>

      <button type="button" class="import-row" id="import-file">
        <span>从笔记导入（PDF / Word / Markdown）</span>
        <span class="dim" aria-hidden="true">选择文件</span>
      </button>

      <p class="hint" id="compose-status" style="text-align:left;margin-top:12px">原文会保留，摘要和归类由系统生成，可以随时改。</p>

      <div class="compose-foot">
        <button type="button" class="btn btn--primary btn--block" id="compose-submit" data-anchor-id="compose.submit">丢进去</button>
        <p class="compose-note">支持批量 · 断网也能写 · 预计 8 秒内生成卡片</p>
      </div>
    </div>
  </main>
</div>
<script src="./app.js"></script>
</body>
</html>
